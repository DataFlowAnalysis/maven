name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Maven repo
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: maven-repo

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Remove previous snapshot artifacts
        run: |
          if [ -d maven-repo/org/dataflowanalysis/vendor ]; then
            find maven-repo/org/dataflowanalysis/vendor -type d -name '*-SNAPSHOT' -exec rm -rf {} +
          fi

      - name: Build and Publish
        run: mvn clean deploy -Dstatic.repo.path="${{ github.workspace }}/maven-repo"

      - name: Push to static Maven repo
        working-directory: maven-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish vendor artifacts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
